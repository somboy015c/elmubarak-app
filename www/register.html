<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your account — Elmubarak Digital Hub</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  if (Api.isLoggedIn()) { location.href = 'dashboard.html'; }
</script>
<a href="index.html" class="home-float-btn" aria-label="Back to home">
  <svg class="icon" viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
</a>
<div class="auth-shell">
  <div class="auth-visual" style="--auth-bg-image: url('https://images.pexels.com/photos/1102754/pexels-photo-1102754.jpeg?auto=compress&cs=tinysrgb&w=1200');">
    <a href="index.html" class="brand">
      <img class="header-logo" src="assets/logo-wide.png" alt="Elmubarak Digital Hub logo" />
    </a>
    <div class="quote">"Fund once. Top up anything, anytime."</div>
    <div></div>
  </div>
  <div class="auth-form-side">
    <div class="auth-box">
      <h2>Create your account</h2>
      <p>Set up your wallet in under a minute.</p>
      <form id="register-form">
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" required placeholder="e.g. Amina Yusuf" />
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" required placeholder="080..." />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="6" placeholder="At least 6 characters" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      </form>
      <div class="switch-link">Already have an account? <a href="login.html"><strong>Log in</strong></a></div>
    </div>
  </div>
</div>

<script>
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Creating account...';
    try {
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const data = await Api.post('/auth/register', { fullName, email, phone, password });
      Api.setSession(data.token, data.user);
      location.href = 'dashboard.html';
    } catch (err) {
      toast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
  });
</script>

</a>
</body>
</html>
