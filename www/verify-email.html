<body>

<a href="index.html" class="home-float-btn" aria-label="Back to home">
  <svg class="icon" viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
</a>
<div class="auth-shell">
  <div class="auth-visual" style="--auth-bg-image: url('https://images.pexels.com/photos/1102754/pexels-photo-1102754.jpeg?auto=compress&cs=tinysrgb&w=1200');">
    <a href="index.html" class="brand">
      <img class="header-logo" src="assets/logo-wide-light.png" alt="Elmubarak Digital Hub logo" />
    </a>
    <div class="quote">"Almost there. Enter your code to activate your wallet."</div>
    <div></div>
  </div>
  <div class="auth-form-side">
    <div class="auth-box">
      <div id="email-view">
        <h2>Verify your email</h2>
        <p>Enter your email and we'll send you a 6-digit code.</p>
        <form id="email-form">
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" type="email" required autocomplete="email" placeholder="you@example.com" />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send code</button>
        </form>
        <div class="switch-link"><a href="login.html"><strong>Back to log in</strong></a></div>
      </div>
      <div id="otp-view" class="hidden"></div>
    </div>
  </div>
</div>
<script src="js/password-toggle.js?v=20261027"></script>
<script>
  const emailView = document.getElementById('email-view');
  const otpView = document.getElementById('otp-view');
  function showOtp(email) {
    emailView.classList.add('hidden');
    otpView.classList.remove('hidden');
    OtpUI.mount(otpView, {
      email,
      autoSend: true,
      onChangeEmail() {
        otpView.classList.add('hidden');
        emailView.classList.remove('hidden');
      }
    });
  }
  document.getElementById('email-form').addEventListener('submit', (e) => {
    e.preventDefault();
    showOtp(document.getElementById('email').value.trim());
  });
  const givenEmail = new URLSearchParams(location.search).get('email');
  if (givenEmail) showOtp(givenEmail);
</script>
